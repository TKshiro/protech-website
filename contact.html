<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="This legacy contact page redirects maintainers to the active frontend contact page.">
    <meta http-equiv="refresh" content="0;url=frontend/contact.html">
    <title>Redirecting to Contact | PROTECH</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        main {
            width: min(520px, calc(100% - 40px));
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 20px 70px rgba(15, 23, 42, 0.08);

            color: #475569;
            line-height: 1.8;
        }
        a {
            color: #d9465d;
            font-weight: 700;
        }

</head>
<body>
    <main>
        <h1>Redirecting to the active contact page</h1>
        <p>このルート直下の旧お問い合わせページは使用しません。自動的に <a href="frontend/contact.html">frontend/contact.html</a> へ移動します。</p>

</html>
