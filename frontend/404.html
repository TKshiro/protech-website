<!DOCTYPE html>

<head>

    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --tech-blue: #001A33;
            --font-h1: 48px;
            --font-h2: 24px;
            --font-body: 15px;
            --font-button: 12px;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .serif {
            font-family: 'Noto Sans JP', sans-serif;
        }

        h1 { font-size: var(--font-h1); }
        h2 { font-size: var(--font-h2); }
        p, body { font-size: var(--font-body); }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }

        .hamburger line {
            transition: all 0.3s ease;
            transform-origin: center;
        }

        .hamburger.active #line1 {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburger.active #line2 {
            opacity: 0;
        }

        .hamburger.active #line3 {
            transform: translateY(-7px) rotate(-45deg);
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'tech-blue': '#001A33' }
                }
            }
        }
    </script>
</head>

<body class="bg-white text-slate-900">

    <nav class="fixed w-full z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-6 h-16 md:h-20 flex justify-between items-center">
            <a href="/"
                class="text-xl md:text-2xl font-bold tracking-tighter text-tech-blue z-50 relative">PROTECH</a>
            <div class="hidden md:flex items-center space-x-10 text-sm font-bold tracking-widest uppercase">
                <a href="/" class="hover:text-blue-600 transition">トップ</a>
                <a href="/services" class="hover:text-blue-600 transition">サービス</a>
                <a href="/company" class="hover:text-blue-600 transition">会社概要</a>
                <a href="/cases" class="hover:text-blue-600 transition">導入事例</a>
                <a href="/blog" class="hover:text-blue-600 transition">ブログ</a>
                <a href="/contact" class="hover:text-blue-600 transition">お問合せ</a>
            </div>
            <button id="menu-btn" class="md:hidden p-2 text-tech-blue z-50 relative focus:outline-none hamburger">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <line id="line1" x1="4" y1="6" x2="20" y2="6"></line>
                    <line id="line2" x1="4" y1="12" x2="20" y2="12"></line>
                    <line id="line3" x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <div id="mobile-menu"
        class="fixed top-0 right-0 h-full w-64 bg-white shadow-lg z-40 transform translate-x-full md:hidden">
        <div class="flex flex-col items-center justify-center h-full space-y-8 pt-20">
            <a href="/" class="text-lg font-bold text-slate-700">トップ</a>
            <a href="/services" class="text-lg font-bold text-slate-700">サービス</a>
            <a href="/company" class="text-lg font-bold text-slate-700">会社概要</a>
            <a href="/cases" class="text-lg font-bold text-slate-700">導入事例</a>
            <a href="/blog" class="text-lg font-bold text-slate-700">ブログ</a>
            <a href="/contact" class="text-lg font-bold text-slate-700">お問合せ</a>
        </div>
    </div>

    <main class="min-h-screen flex items-center justify-center px-6 pt-20">
        <div class="text-center max-w-xl mx-auto">
            <p class="text-[120px] md:text-[180px] font-bold text-tech-blue/5 leading-none select-none serif">404</p>
            <div class="-mt-16 md:-mt-24 relative z-10">
                <h1 class="text-3xl md:text-4xl font-bold serif text-tech-blue mb-6">ページが見つかりません</h1>
                <p class="text-gray-500 leading-relaxed mb-12 text-sm md:text-base">
                    お探しのページは、移動または削除されたか、<br class="hidden md:block">URLが間違っている可能性があります。
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="/"
                        class="px-10 py-4 bg-tech-blue text-white text-xs font-bold tracking-widest hover:opacity-90 transition shadow-lg uppercase">トップページへ戻る</a>
                    <a href="/contact"
                        class="px-10 py-4 border border-slate-200 text-xs font-bold tracking-widest hover:bg-tech-blue hover:text-white transition uppercase">お問い合わせ</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-16 md:py-20 text-center bg-white border-t border-gray-100">
        <div class="max-w-7xl mx-auto px-6">
            <div class="text-tech-blue font-bold text-2xl md:text-3xl mb-8 tracking-tighter uppercase">PROTECH</div>
            <div
                class="flex justify-center flex-wrap gap-6 md:gap-8 mb-10 text-[10px] md:text-xs font-bold tracking-widest text-gray-400">
                <a href="/services" class="hover:text-blue-600 transition">サービス</a>
                <a href="/company" class="hover:text-blue-600 transition">会社概要</a>
                <a href="/cases" class="hover:text-blue-600 transition">導入事例</a>
                <a href="/blog" class="hover:text-blue-600 transition">ブログ</a>
            </div>
            <p class="text-[10px] text-gray-400 tracking-widest">© 2026 PROTECH Inc. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuBtn.classList.toggle('active');
            mobileMenu.classList.toggle('translate-x-full');
        });

        document.addEventListener('click', (e) => {
            if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
                menuBtn.classList.remove('active');
                mobileMenu.classList.add('translate-x-full');
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                menuBtn.classList.remove('active');
                mobileMenu.classList.add('translate-x-full');
            }
        });
    </script>

</body>

</html>
