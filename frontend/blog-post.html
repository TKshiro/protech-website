<head>

    <meta charset="UTF-8">

    <title id="page-title">記事 - PROTECH株式会社</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            --tech-blue: #001A33;
            --font-h1: 48px;
            --font-h2: 24px;
            --font-body: 15px;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
        }
        .btn-coral {
            background: #E86B7A;
            color: white;
            transition: opacity 0.2s;
        }
        .btn-coral:hover { opacity: 0.85; }
        .text-coral { color: #E86B7A !important; }
        .nav-link { transition: color 0.2s; }
        .nav-link:hover { color: #E86B7A; }
        .hamburger line {
            transition: all 0.3s ease;
            transform-origin: center;
        }
        .hamburger.active #line1 { transform: translateY(7px) rotate(45deg); }
        .hamburger.active #line2 { opacity: 0; }
        .hamburger.active #line3 { transform: translateY(-7px) rotate(-45deg); }
        .article-content h2 {
            font-size: 1.5em;
            font-weight: 700;
            margin: 1.5em 0 0.5em;
            color: var(--tech-blue);
        }
        .article-content h3 {
            font-size: 1.25em;
            font-weight: 600;
            margin: 1.25em 0 0.5em;
            color: var(--tech-blue);
        }
        .article-content p {
            margin: 1em 0;
            line-height: 1.8;
        }
        .article-content ul, .article-content ol {
            margin: 1em 0;
            padding-left: 2em;
            line-height: 1.8;
        }
        .article-content li {
            margin: 0.5em 0;
        }
        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 1.5em 0;
        }
        .article-content strong {
            font-weight: 700;
            color: var(--tech-blue);
        }
        .article-content a {
            color: #E86B7A;
            text-decoration: underline;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'tech-blue': '#001A33', 'coral': '#E86B7A' }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-slate-900">

    <nav class="fixed w-full z-50 glass-nav border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-16 md:h-20 flex justify-between items-center">
            <a href="index.html" class="text-xl md:text-2xl font-bold tracking-tighter text-tech-blue z-50 relative">PROTECH</a>
            <div class="hidden md:flex items-center space-x-10 text-sm font-bold tracking-widest uppercase text-slate-600">
                <a href="index.html" class="nav-link">トップ</a>
                <a href="red.html" class="nav-link">小紅書</a>
                <a href="services.html" class="nav-link">サービス</a>
                <a href="company.html" class="nav-link">会社概要</a>
                <a href="cases.html" class="nav-link">導入事例</a>
                <a href="blog.html" class="nav-link text-coral">ブログ</a>
                <a href="contact.html" class="btn-coral px-6 py-2.5 text-xs tracking-widest rounded-full font-bold">お問合せ</a>
            </div>
            <button id="menu-btn" class="md:hidden p-2 text-tech-blue z-50 relative focus:outline-none hamburger">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <line id="line1" x1="4" y1="6" x2="20" y2="6"></line>
                    <line id="line2" x1="4" y1="12" x2="20" y2="12"></line>
                    <line id="line3" x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <div id="mobile-menu" class="fixed top-0 right-0 h-full w-64 bg-white shadow-lg z-40 transform translate-x-full md:hidden transition-transform duration-300 ease-in-out">
        <div class="flex flex-col items-center justify-center h-full space-y-8 pt-20">
            <a href="index.html" class="text-lg font-bold text-slate-700">トップ</a>
            <a href="red.html" class="text-lg font-bold text-slate-700">小紅書</a>
            <a href="services.html" class="text-lg font-bold text-slate-700">サービス</a>
            <a href="company.html" class="text-lg font-bold text-slate-700">会社概要</a>
            <a href="cases.html" class="text-lg font-bold text-slate-700">導入事例</a>
            <a href="blog.html" class="text-lg font-bold text-coral">ブログ</a>
            <a href="contact.html" class="text-lg font-bold text-slate-700">お問合せ</a>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-6 pt-32 md:pt-40 pb-20">
        <div id="article-container">
            <p class="text-center text-gray-400 py-20">記事を読み込んでいます...</p>
        </div>
    </main>

    <footer class="bg-[#0a1628] text-white pt-16 md:pt-20 pb-8 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="grid md:grid-cols-4 gap-12 md:gap-8 mb-16">
                <div class="md:col-span-1">
                    <div class="text-2xl font-bold tracking-tighter mb-4">PROTECH</div>
                    <p class="text-white/30 text-xs leading-relaxed">
                        テクノロジーとマーケティングで、<br>ビジネスの境界を越える。
                    </p>
                </div>
                <div>
                    <h4 class="text-white/60 text-xs font-bold tracking-[0.2em] uppercase mb-6">サービス</h4>
                    <ul class="space-y-3 text-sm text-white/40">
                        <li><a href="red.html" class="hover:text-coral transition">小紅書(RED)マーケティング</a></li>
                        <li><a href="services.html" class="hover:text-coral transition">UI/UXデザイン</a></li>
                    </ul>
                </div>
                <div>
                    <h4 class="text-white/60 text-xs font-bold tracking-[0.2em] uppercase mb-6">会社情報</h4>
                    <ul class="space-y-3 text-sm text-white/40">
                        <li><a href="company.html" class="hover:text-coral transition">会社概要</a></li>
                        <li><a href="cases.html" class="hover:text-coral transition">導入事例</a></li>
                        <li><a href="blog.html" class="hover:text-coral transition">ブログ</a></li>
                        <li><a href="privacy.html" class="hover:text-coral transition">プライバシーポリシー</a></li>
                    </ul>
                </div>
                <div>
                    <h4 class="text-white/60 text-xs font-bold tracking-[0.2em] uppercase mb-6">お問合せ</h4>
                    <ul class="space-y-3 text-sm text-white/40">
                        <li><a href="contact.html" class="hover:text-coral transition">お問合せ</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="border-t border-white/10 pt-8 text-center">
            <p class="text-[10px] text-white/30">© 2026 PROTECH Inc. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        const CATEGORY_COLORS = {
            '小紅書運用': 'bg-red-50 text-red-500',
            'インバウンド': 'bg-blue-50 text-blue-500',
            'マーケティング': 'bg-purple-50 text-purple-500',
            '運営ノウハウ': 'bg-amber-50 text-amber-500'
        };

        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 1000, once: true });

            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('article-container');

            if (!id) {
                container.innerHTML = '<p class="text-center text-gray-400 py-20">記事が見つかりません。<a href="blog.html" class="text-coral underline">ブログ一覧に戻る</a></p>';
                return;
            }

            try {
                const stored = JSON.parse(localStorage.getItem('protech_blogs') || '[]');
                const article = stored.find(item => item.id === id);
                if (!article) {
                    container.innerHTML = '<p class="text-center text-gray-400 py-20">記事が見つかりません。<a href="blog.html" class="text-coral underline">ブログ一覧に戻る</a></p>';
                    return;
                }

                document.getElementById('page-title').textContent = `${article.title} - PROTECH`;
                const colorClass = CATEGORY_COLORS[article.category] || 'bg-slate-100 text-slate-500';
                const dateStr = article.date ? article.date.replace(/-/g, '.') : '';
                const img = article.imageUrl
                    ? `<img src="${article.imageUrl}" alt="${article.title}" class="w-full h-64 md:h-96 object-cover rounded-2xl mb-8">`
                    : '';

                container.innerHTML = `
                    <div data-aos="fade-up">
                        <div class="mb-6">
                            <a href="blog.html" class="inline-flex items-center text-sm text-gray-400 hover:text-coral transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                                </svg>
                                ブログ一覧に戻る
                            </a>
                        </div>
                        <div class="flex items-center gap-3 mb-6">
                            <span class="text-xs text-gray-400 font-mono tracking-tighter">${dateStr}</span>
                            <span class="text-[9px] font-bold ${colorClass} px-3 py-1 rounded uppercase tracking-widest">${article.category}</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-bold text-tech-blue mb-8 leading-tight">${article.title}</h1>
                        ${img}
                        <div class="article-content text-gray-700 leading-relaxed">
                            ${article.content}
                        </div>
                        <div class="mt-12 pt-8 border-t border-gray-200">
                            <a href="blog.html" class="inline-flex items-center text-sm font-bold text-coral hover:underline">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                                </svg>
                                ブログ一覧に戻る
                            </a>
                        </div>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = '<p class="text-center text-gray-400 py-20">記事の読み込みに失敗しました。<a href="blog.html" class="text-coral underline">ブログ一覧に戻る</a></p>';
            }

            const menuBtn = document.getElementById('menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (menuBtn && mobileMenu) {
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menuBtn.classList.toggle('active');
                    mobileMenu.classList.toggle('translate-x-full');
                });
                document.addEventListener('click', (e) => {
                    if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
                        menuBtn.classList.remove('active');
                        mobileMenu.classList.add('translate-x-full');
                    }
                });
                window.addEventListener('resize', () => {
                    if (window.innerWidth >= 768) {
                        menuBtn.classList.remove('active');
                        mobileMenu.classList.add('translate-x-full');
                    }
                });
            }
        });
    </script>
</body>
</html>
